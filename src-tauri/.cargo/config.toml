# Every cargo invocation in this workspace, so a build by hand, `pnpm verify`
# and CI all agree.
[env]
# ⚠️ **THE SWIFT RUNTIME IS WHY THIS EXISTS, AND THE DEFAULT IS TOO LOW.**
# Rust's default macOS deployment target is far below 14, and at that target
# the linker resolves `libswift_Concurrency` through a BACK-DEPLOYED copy
# referenced as `@rpath/…` — which is in nobody's rpath, so the binary links
# perfectly and dies at launch with "Library not loaded … no LC_RPATH's found".
# At 14.0 it links against the copy in the OS. Measured 2026-09-23: without it
# `cargo test --workspace` fails before a single test runs.
#
# This does not narrow what the app supports. The desktop build links a Swift
# static library whose package declares `.macOS(.v14)`, so a build carrying the
# Chinese voice already cannot run below 14; this makes the Rust half say so.
MACOSX_DEPLOYMENT_TARGET = "14.0"
