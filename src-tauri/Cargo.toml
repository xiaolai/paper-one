[package]
name = "app"
version = "0.1.3"
description = "Paper — an ebook reader with a companion"
authors = ["Paper"]
license = "MIT"
repository = "https://github.com/xiaolai/paper-one"
edition = "2021"
rust-version = "1.91"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
# For the `path` header of `write_atomic`, encoded the way the fs plugin's
# client encodes its own (`atomic.rs`). Already in the tree through the peer
# plugin's pairing URI.
percent-encoding = "2"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `macos-private-api` is required for `titleBarStyle: "Overlay"` to honour
# `trafficLightPosition`; without it the position is silently ignored. It
# stays on THIS line, unconditionally, and cannot move behind the `desktop`
# feature: tauri-build's allowlist check (tauri-build/src/manifest.rs) reads
# the `features = [...]` array of this dependency as manifest text and, with
# `macOSPrivateApi: true` in tauri.conf.json, refuses to build unless the
# feature is literally listed here — it knows nothing about `[features]`
# forwarding, and the same check runs against the same config on every target,
# so a per-platform config would only flip which platform fails. The feature
# is inert on iOS and Android. `tray-icon` is exempt from that check and does
# ride on `desktop`. `image-png` decodes the tray asset and the window icon
# on every platform.
tauri = { version = "2.11.3", features = ["macos-private-api", "image-png"] }
tauri-plugin-log = "2"
# Reopening a book, and the reader's own work outliving the webview's storage.
# A picked `File` is a handle to bytes granted for one session, and localStorage
# has a quota and no backup — see dev-docs/plans/phase-02-native-storage-and-library.md.
# NO `watch` FEATURE. It was here for the connected-folder import, which is gone
# — and it is worth knowing why it needed saying: `watch` is a feature flag, not
# a default, so without it the plugin still builds, the JS `watch()` import still
# resolves, and the call fails at RUNTIME. Anything reaching for it again needs
# the flag AND the `fs:allow-watch` permission, or it will be green everywhere
# except in the app.
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# The dialog grants a chosen path into the fs scope for that RUNTIME only, so a
# stored path is unreadable after a relaunch and the shelf cannot reopen the
# book. This persists the scope and restores it at launch. Desktop only: it
# exists for pre-vault rows, which only a desktop shelf can have.
tauri-plugin-persisted-scope = { version = "2", optional = true }
# Automation bridge for e2e testing. Registered only in debug desktop builds
# (see lib.rs); kept a normal dependency rather than a dev-dependency because
# dev-dependencies do not apply to a binary's own debug profile.
tauri-plugin-mcp-bridge = { version = "0.12", optional = true }
# ONE PROCESS PER MACHINE, and the second one's files handed to the first.
# A second launch on Windows or Linux was a second process over one journal;
# on every platform a double-clicked book while the app was running went to a
# new process that the library lock then refused. This is registered FIRST in
# lib.rs, so the newcomer forwards its argv and exits before it reaches the
# lock. `.dbus_id` is set there: Flathub has threatened to refuse Tauri apps
# over the plugin's default D-Bus name. Both this and window-state are
# `#![cfg(not(mobile))]` crates and MUST ride on `desktop` — listed plainly,
# they break the iOS and Android builds. Measured on macOS: +7 crates between
# them (+44 on Linux, all zbus).
tauri-plugin-single-instance = { version = "2.4.3", optional = true }
# The window's size, position and maximised state across a relaunch. Stored
# and restored as PHYSICAL pixels since 2.x (plugins-workspace #1743); the
# Retina doubling filed as #3521 is what `window_state.rs`'s live check is for.
tauri-plugin-window-state = { version = "2.4.1", optional = true }
# The peer transport, on every platform (crates/tauri-plugin-peer).
tauri-plugin-peer = { path = "crates/tauri-plugin-peer" }
# Where the data lives — for the library lock (`src/lock.rs`). A plain
# library, not a capability, so no capability's removal takes it away.
paper-data-root = { path = "crates/paper-data-root" }
paper-process = { path = "crates/paper-process" }
# The local inference runtime (crates/tauri-plugin-inference). DESKTOP ONLY and
# therefore optional: `lemond` ships for macOS, Windows and Linux and there is
# no mobile build of it, so a phone has nothing for this plugin to supervise.
# Gating it here — rather than only at the `.plugin()` call — is what keeps its
# rustls provider from being compiled for iOS and Android at all.
tauri-plugin-inference = { path = "crates/tauri-plugin-inference", optional = true }
# The shelf's web face (phase 18). DESKTOP ONLY and therefore optional, for the
# same reason the local inference runtime is: a phone is a satchel, never a
# shelf, and has nothing to serve. Gating it here rather than at the router
# keeps it out of the mobile build entirely.
#
# NOTE FOR ANYONE EDITING THIS COMMENT: do not name another path crate in it.
# `capability:remove` cuts a crate by purging its name from this file, and
# `scripts/lib/removal.test.mjs` asserts the name is then gone — a mention in
# prose here is enough to fail it. Two were named in the first draft of this
# block and both failed exactly that way.
#
# The browser client's host (crates/tauri-plugin-webhost). DESKTOP ONLY, for
# the reason written on the dependency below it. The app used to declare
# `axum` here as well — a vestige of when the host lived in this crate; the
# server crate under the plugin declares it with the identical feature set,
# and the why-axum reasoning lives beside that declaration now. App code
# never references it, so a direct dependency here was a name for nothing.
tauri-plugin-webhost = { path = "crates/tauri-plugin-webhost", optional = true }

# One feature per platform, and the platform set is closed: `desktop` (the
# default), `ios`, `android`. A mobile check runs with `--no-default-features
# --features ios`, which is what keeps the tray, the automation bridge and the
# persisted scope from being compiled — not just skipped — on a phone.
# `tauri/tray-icon` rides here too (the tray code in lib.rs is gated on this
# feature, since without it the tray types do not exist); `macos-private-api`
# cannot, for the reason on the `tauri` line above. `ios` and `android`
# forward to the plugin's features of the same name so one flag reaches both
# crates (WI-5.9 checks that features, registration and the manifest agree).
# macOS ONLY, and for ONE call — see `nudge_traffic_lights` in lib.rs.
#
# `trafficLightPosition` in tauri.conf.json reaches tao's window state and is
# applied only from tao's `drawRect:` (tao-0.35.0 `view.rs`); the setter itself
# merely stores it (`window.rs` `set_traffic_light_inset`). A WKWebView covers
# the tao view, so that `drawRect:` does not run at first paint and the buttons
# sit where AppKit put them until something marks the view dirty — a resize,
# usually, which is why the misplacement looks like it "fixes itself".
#
# NOT A NEW SUPPLY CHAIN: both crates are already in the tree beneath tao and
# wry, so this declares what is there rather than adding to it. `objc2-app-kit`
# rather than raw `msg_send!` because this is unsafe FFI and a typed
# `contentView()` is worth more than the byte it saves.
# The library lock (`src/lock.rs`): liveness by `kill(pid, 0)` and the host
# name by `gethostname`, both Unix. Already in the tree through tauri; this
# names the dependency rather than reaching it by accident.
# ⚠️ **A CRYPTO PROVIDER, BECAUSE MOBILE HAS NONE AND PANICS WITHOUT ONE.**
#
# ⚠️ NAMES NO PATH CRATE, deliberately — see the note further up this file:
# `capability:remove` cuts a crate by purging its NAME from here, so a crate
# named in prose is a crate the cut would maim. The first version of this
# comment named two of them and `capability-remove`'s own test said so.
#
# `reqwest` is configured `rustls-no-provider` across this workspace, which
# turns off rustls's automatic provider selection: the PROCESS must install one
# before anything builds a `Client`. On desktop the local inference plugin
# brings that provider — which is exactly what its own note above says is being
# kept out of the mobile build — so gating that plugin off left iOS and Android
# with no provider at all. iroh still builds a client for its relays, so the app
# panicked on the FIRST LAUNCH, every launch:
#
#   No rustls crypto provider is configured. When using the
#   `rustls-no-provider` feature you must install a crypto provider before
#   building a Client.
#
# Measured on the iOS simulator, 2026-08-30 — the first time this app had ever
# been RUN on a phone. CI builds an unsigned archive and an apk and never
# launches either, so a startup panic was invisible to it.
#
# `ring`, never `aws-lc-rs`: the same choice the peer plugin makes for iroh and
# for the same reason — aws-lc-rs needs a C/asm build with an NDK-configured
# clang, and `mobile.yml` fails the build if it appears in the tree at all.
# `default-features = false` is what states that, since rustls's defaults
# include the other one.
#
# MOBILE ONLY, deliberately. Installing a provider is process-global and
# first-call-wins, so doing it on desktop would quietly move desktop TLS onto
# ring — a behaviour change on a platform that has no problem.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSResponder"] }

[features]
default = ["desktop"]
desktop = [
    "dep:tauri-plugin-mcp-bridge",
    "dep:tauri-plugin-persisted-scope",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-window-state",
    "dep:tauri-plugin-inference",
    "dep:tauri-plugin-webhost",
    "tauri/tray-icon",
]
ios = ["tauri-plugin-peer/ios"]
android = ["tauri-plugin-peer/android"]

# Nested workspace: the app is the root package and every Tauri plugin crate
# lives under crates/. Nested (not repo‑root) so Cargo.lock, the icon paths and
# scripts/bump-version.sh keep their location. `resolver = "2"` is the edition‑
# 2021 resolver, stated explicitly because a workspace root sets it, not the
# member.
[workspace]
members = ["crates/*"]
resolver = "2"
