[package]
name = "app"
version = "0.1.1"
description = "Paper — an ebook reader with a companion"
authors = ["Paper"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# macos-private-api is required for `titleBarStyle: "Overlay"` to honour
# `trafficLightPosition`; without it the position is silently ignored.
tauri = { version = "2.11.3", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
# Reopening a book, and the reader's own work outliving the webview's storage.
# A picked `File` is a handle to bytes granted for one session, and localStorage
# has a quota and no backup — see docs/plans/phase-02-native-storage-and-library.md.
# NO `watch` FEATURE. It was here for the connected-folder import, which is gone
# — and it is worth knowing why it needed saying: `watch` is a feature flag, not
# a default, so without it the plugin still builds, the JS `watch()` import still
# resolves, and the call fails at RUNTIME. Anything reaching for it again needs
# the flag AND the `fs:allow-watch` permission, or it will be green everywhere
# except in the app.
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
# The dialog grants a chosen path into the fs scope for that RUNTIME only, so a
# stored path is unreadable after a relaunch and the shelf cannot reopen the
# book. This persists the scope and restores it at launch.
tauri-plugin-persisted-scope = "2"
# Automation bridge for e2e testing. Registered only in debug builds (see
# lib.rs); kept a normal dependency rather than a dev-dependency because
# dev-dependencies do not apply to a binary's own debug profile.
tauri-plugin-mcp-bridge = "0.12"
