[package]
name = "paper-process"
version = "0.1.0"
description = "Process identity for Paper: when a pid started and when this host booted, so a pid in a record is never mistaken for the process that wrote it"
authors = ["Paper"]
license = "MIT"
edition = "2021"
# Matches the app crate and the plugins; the toolchain itself is pinned by
# the root rust-toolchain.toml.
rust-version = "1.91"
# Not a crates.io crate: a workspace member of the app.
publish = false

# Only where it is used: the macOS arm reads `proc_pidinfo`, the Linux arm
# `/proc`; any other Unix compiles the `None` fallback and needs nothing.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"
