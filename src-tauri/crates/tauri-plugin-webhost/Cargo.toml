[package]
name = "tauri-plugin-webhost"
version = "0.1.0"
description = "Paper's browser client host: an HTTP surface on loopback, and the frame pipe between it and the webview"
authors = ["Paper"]
license = ""
edition = "2021"
rust-version = "1.91"
publish = false
# Not a crates.io crate: a workspace member of the app, reached by path.
links = "tauri-plugin-webhost"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2.11.3" }
paper-webhost = { path = "../paper-webhost" }
paper-webauth = { path = "../paper-webauth" }
# Where `webhost/sessions.json` lives: ONE resolution of the data root, shared
# with the app and the other plugins (see that crate's header for why it is
# not a copy of forty lines).
paper-data-root = { path = "../paper-data-root" }
serde = { version = "1", features = ["derive"] }
# `tailscale status --json` is a large document and the two facts wanted from it
# sit inside a NAMED object. Read by hand, the search for `"DNSName"` ran from
# `"Self"` to the end of the file and returned a PEER's hostname when Self had
# none — the pane then told the reader to point a browser at another machine.
# Already compiled (axum's `json` feature and tauri both pull it in), so the
# "adding a dependency to read one field" trade this replaced was not the trade
# it looked like.
serde_json = "1" 
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["net", "rt"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "json"] }

[dev-dependencies]
# Drives the real router over the real embedded table, in-process.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-test = "0.4"
