[package]
name = "paper-data-root"
version = "0.1.0"
description = "Where Paper's data lives: one resolution of the storage root, shared by the app and every plugin that writes under it"
authors = ["Paper"]
license = ""
edition = "2021"
# Matches the app crate and the plugins; the toolchain itself is pinned by
# the root rust-toolchain.toml.
rust-version = "1.91"
# Not a crates.io crate: a workspace member of the app.
publish = false

[dependencies]
# For `AppHandle::path().app_data_dir()` — the default root. The same version
# and feature set the plugins use.
tauri = { version = "2.11.3", default-features = false }
