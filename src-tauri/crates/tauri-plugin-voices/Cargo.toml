[package]
name = "tauri-plugin-voices"
version = "0.1.0"
description = "Paper's downloadable voices: the catalogue, the installer, and the engines that read a book aloud"
authors = ["Paper"]
license = "MIT"
edition = "2021"
rust-version = "1.91"
publish = false
# Not a crates.io crate: a workspace member of the app, reached by path.

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
# The digest a pack is checked against is SHA-256 because that is what the model
# hosts publish; `digest.rs` says why it is not BLAKE3, which is already here.
sha2 = "0.10"
data-encoding = "2"
# `fs` and `io-util` for the streamed download and the streamed hash, `sync` for
# the stop token the fetch loop waits on, `macros` for `select!` in that loop.
tokio = { version = "1", features = ["rt", "fs", "sync", "io-util", "macros"] }
futures-util = { version = "0.3", default-features = false }
# `stream` is what makes a 2 GB download arrive in chunks rather than in memory.
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2"] }
# ONNX Runtime, which is what runs Kokoro. `tract` — pure Rust, nothing fetched
# at build time — was tried first and cannot load the model: it refuses the
# vocoder's STFT node. See `kokoro.rs`.
ort = "2.0.0-rc.13"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
