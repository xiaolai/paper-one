# The unified gate, on a clean clone. `pnpm verify` is the copy‑paste command a
# developer runs locally; CI runs exactly the same thing so "green here" and
# "green there" are one fact. (dev-docs/plans/phase-05-kernel-capabilities.md, K.12)
name: verify

on:
  push:
    branches: [main, ui-polish, kernel-carve]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host (macOS, desktop target)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version comes from package.json#packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml at the repo root pins the channel; this action
          # installs rustup and defers to it.
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # `companion`, and it is the ONLY capability this can name. The comment
      # here used to say that of `sync`, and it was wrong: `src/cli/paper.ts`
      # imports `capabilities/sync` for `openLocalJournal`, `capability:remove`
      # has never edited a host, and so the typecheck failed on every push.
      #
      # Measured: `peer` has three host imports and `sync` one, all in
      # `src/cli/`; `inference` is required by `companion` and its removal is
      # refused. That leaves one leaf. "Deletion is an operation" is therefore
      # a narrower claim than this step has been making — it holds for a
      # capability no host has reached into, and the CLI has reached into two.
      # Widening it again means giving the CLI a seam for the sync journal,
      # which it cannot get by composing sync: sync requires peer, peer is a
      # Tauri plugin crate, and neither exists in a Node process.
      #
      # This named `example` for months after the capability called `example`
      # was deleted (19bac0e, "Delete the capability that existed to be
      # deleted"). `capability:remove` refused an id the manifest does not
      # declare, so the step failed on every push and the deletion proof proved
      # nothing the whole time. `verify-without.test.mjs` now asserts three
      # things about this argument — the manifest declares it, nothing requires
      # it, and no host imports it — so the next rename, and the next host
      # import, fail in the suite instead of here.
      - name: Deletion is an operation (temp checkout)
        run: pnpm verify:without companion
