# The unified gate, on a clean clone. `pnpm verify` is the copy‑paste command a
# developer runs locally; CI runs exactly the same thing so "green here" and
# "green there" are one fact. (docs/plans/phase-05-kernel-capabilities.md, K.12)
name: verify

on:
  push:
    branches: [main, ui-polish, kernel-carve]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host (macOS, desktop target)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version comes from package.json#packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml at the repo root pins the channel; this action
          # installs rustup and defers to it.
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # `sync`, and not by preference: it is the only capability that can be
      # removed on its own. `peer` is required by `sync`, so `capability:remove
      # peer` refuses until `sync` goes first — correctly, and loudly.
      #
      # This named `example` for months after the capability called `example`
      # was deleted (19bac0e, "Delete the capability that existed to be
      # deleted"). `capability:remove` refused an id the manifest does not
      # declare, so the step failed on every push and the deletion proof proved
      # nothing the whole time. `verify-without.test.mjs` now asserts that this
      # argument names a capability the manifest declares AND that nothing
      # requires it, so the next rename fails in the suite instead of here.
      - name: Deletion is an operation (temp checkout)
        run: pnpm verify:without sync
