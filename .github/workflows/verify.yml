# The unified gate, on a clean clone. `pnpm verify` is the copy‑paste command a
# developer runs locally; CI runs exactly the same thing so "green here" and
# "green there" are one fact. (dev-docs/plans/phase-05-kernel-capabilities.md, K.12)
#
# THREE LEGS SINCE PHASE 20 (WI-20.38, D10), and what each one is for:
#
#   host     macOS — the full gate, as it always was, plus the deletion proof.
#   linux    Ubuntu 24.04 — the SAME `pnpm verify`, unchanged, after Tauri's
#            system libraries. Every Tauri app surveyed runs its tests on one
#            primary Linux runner; this is the first time this repository's
#            gate has run anywhere but a Mac. The app's Rust tests are pure
#            functions and the peer fixtures are "relays off, no discovery"
#            over loopback, so nothing here needs a display.
#   windows  check only — `cargo check --workspace --all-targets` plus the JS
#            half of the gate. A full Windows gate is the ~33-minute leg the
#            survey found, for a platform nothing here is yet marked Shipped
#            on; the check is what catches a `cfg(target_os = "macos")` that
#            leaked into shared code.
#
# Bundling is NOT here. It lives in `bundle.yml`, tag-triggered, on the glibc
# floor (Ubuntu 22.04) — a release artifact is a different event from a green
# commit, and the surveyed apps keep the two apart.
name: verify

on:
  push:
    # `main` only: `ui-polish` and `kernel-carve` were merged and deleted, and
    # every other branch reaches CI through its pull request below.
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: host (macOS, desktop target)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version comes from package.json#packageManager
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml at the repo root pins the channel to this same
          # version; this input is not deferral — dtolnay/rust-toolchain
          # installs exactly what it is given — so the two must move together,
          # and `bump`-style changes to the toolchain touch both.
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # `companion`, and it is the ONLY capability this can name. The comment
      # here used to say that of `sync`, and it was wrong: `src/cli/paper.ts`
      # imports `capabilities/sync` for `openLocalJournal`, `capability:remove`
      # has never edited a host, and so the typecheck failed on every push.
      #
      # Measured: `peer` has three host imports and `sync` one, all in
      # `src/cli/`; `inference` is required by `companion` and its removal is
      # refused. That leaves one leaf. "Deletion is an operation" is therefore
      # a narrower claim than this step has been making — it holds for a
      # capability no host has reached into, and the CLI has reached into two.
      # Widening it again means giving the CLI a seam for the sync journal,
      # which it cannot get by composing sync: sync requires peer, peer is a
      # Tauri plugin crate, and neither exists in a Node process.
      #
      # This named `example` for months after the capability called `example`
      # was deleted (19bac0e, "Delete the capability that existed to be
      # deleted"). `capability:remove` refused an id the manifest does not
      # declare, so the step failed on every push and the deletion proof proved
      # nothing the whole time. `verify-without.test.mjs` now asserts three
      # things about this argument — the manifest declares it, nothing requires
      # it, and no host imports it — so the next rename, and the next host
      # import, fail in the suite instead of here.
      - name: Deletion is an operation (temp checkout)
        run: pnpm verify:without companion

  linux:
    name: linux (Ubuntu 24.04, full gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      # Tauri 2's own list for a Debian-family host: the WebKitGTK the webview
      # is, the appindicator the tray icon needs, and librsvg for icons.
      # `tauri-plugin-mcp-bridge` (debug builds only, behind the `desktop`
      # feature) carries a Linux screenshot module of its own; whether it
      # compiles here is the one thing D10 left unverified, and this job is
      # what answers it.
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # ⚠️ **THE MUTATION GATE, WHICH GATED NOTHING UNTIL NOW.**
  #
  # `scripts/check-mutants.mjs` says of itself that "a test that cannot fail is
  # a red gate", that a survivor fails rather than a score, and that none may
  # survive. It was in no `verify.mjs` step and in no workflow, so the only
  # thing enforcing it was somebody remembering to type `pnpm mutants`. Six
  # assertions that could not fail were found on one branch by planting the
  # defect back by hand; that is what this exists to catch mechanically.
  #
  # PULL REQUESTS ONLY, and scoped to the diff. The script mutates one subject
  # at a time against only its covering tests, so the cost is linear in the
  # change rather than in the repository — its header measures the alternative
  # at 8m26s without finishing. On a push to `main` the merge base is the tip,
  # so there would be nothing to mutate and nothing to learn.
  #
  # ⚠️ **`fetch-depth: 0` AND `--require-base` ARE BOTH LOAD-BEARING.** A CI
  # checkout is shallow and has everything committed, so a failed `merge-base`
  # would leave the working tree as the whole scope — and it is clean here.
  # Zero subjects, "nothing changed to mutate", exit 0: a gate that scanned
  # nothing and reported success, on every pull request. The flag refuses that
  # rather than narrowing to it.
  #
  # `continue-on-error` is deliberately NOT set. A gate that cannot fail is the
  # thing these three jobs are about.
  #
  # ⚠️ **ONE RUNNER COULD NOT HOLD THE SWEEP, AND THE ONE JOB THAT TRIED HAD
  # NEVER RUN** (measured 2026-09-14). `feat/looking-up` changes 79 files
  # carrying 15 898 whole-file mutants. With nine Stryker runners on a 10-core
  # Mac, `scripts/check-mutants.mjs` alone took 18 min 5 s and most other files
  # 15-70 s; this was one 4-vCPU job with 45 minutes. So the sweep is planned
  # ONCE, swept by isolated shards, and reconciled by an aggregate that is the
  # only job able to pass it:
  #
  #   mutants-plan    freezes the subjects, their content hashes, covering tests,
  #                   classes, mutant counts and shards into one manifest.
  #   mutants-shard   one matrix job per shard, each its own checkout. Each
  #                   re-derives the plan and REFUSES a checkout that differs,
  #                   sweeps only its own files, and uploads one result per file
  #                   and a receipt whether or not its sweep passed.
  #   mutants         the aggregate, and the check that matters. It runs whatever
  #                   the shards did, and fails unless every planned file has
  #                   exactly one passing result and every shard left a receipt.
  #
  # SIZING. Sharding splits the files, never the slowest file, so no number of
  # shards shortens the shard that holds `check-mutants.mjs`. It was measured at
  # 18.08 min when Stryker counted 1 174 mutants in it; the change that sharded
  # the sweep grew it to 2 941, and scaling by that count is an ESTIMATE, not a
  # measurement: 18.08 x 2941/1174 x 9 local runners / 4 vCPUs = 102 min, doubled
  # for a slower core and a runner count Stryker may set one lower = 204. The
  # sweep STEP is bounded at 210 and the job at 225, so a step that times out
  # still leaves the upload room to run. Replace the estimate with the first
  # shard's own `durationMs` for that file once one exists. The two
  # heaviest files by mutant count get shards of their own and the rest are
  # balanced by mutant count over the other four — an ESTIMATE, since one mutant
  # cost about fifteen times as much in `check-mutants.mjs` as in
  # `check-browser-safe.mjs`. Every result records its measured duration, which
  # is what a better balance would be built from.
  #
  # ⚠️ 4 vCPUs is what an `ubuntu-24.04` runner gives a PUBLIC repository; a
  # private one's standard runner has 2, which doubles the arithmetic. Stryker
  # prints "Creating N test runner process(es)" in every shard's log: read it on
  # the first run before trusting the bound.
  #
  # ⚠️ AND THE ARITHMETIC ABOVE IS FOR ONE SWEEP PER FILE, WHICH STOPPED BEING
  # WHAT A SWEEP COSTS. Since the merge-base comparison, a file's cost depends on
  # whether a mutant survived in it:
  #
  #   no survivor          one sweep. The common path, and unchanged.
  #   a survivor           + the merge base measured, which sweeps the file
  #                        against EVERY test that reaches it rather than the
  #                        nearest level — wider, so dearer than the sweep here.
  #                        Measured 2026-09-17: session.ts 35 min quiet, 62 min
  #                        loaded; wordSnap/flatten.ts 37 min. Capped per file by
  #                        BASE_DEADLINE_MS (90 min), and taken ONCE per base
  #                        file however many subjects trace to it.
  #   a charge to take     + the subject swept again here against that wider set,
  #                        which is refused outright when its own sweep already
  #                        cost more than WIDEN_BUDGET_MS (20 min), so this one
  #                        cannot double the heaviest file.
  #
  # So the bound below is no longer an estimate of the whole job on a branch that
  # FAILS: one heavy file with survivors can spend most of a 210-minute step by
  # itself. That is deliberate — every expensive path belongs to a build that was
  # already going to be red — but it means a red branch can time out instead of
  # reporting, which is a worse red. Re-derive from the first CI run that
  # measures a base: every result records `durationMs`, and the aggregate prints
  # what each base measurement cost.
  mutants-plan:
    name: mutants (plan)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SHARDS: 6
      ISOLATE: 2
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch has to be here for `merge-base` to resolve; see above.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The base is the PR's target, not a hard-coded `main`: a stacked branch
      # is measured against what it will actually merge into. It reaches the
      # shell through `env`, never spliced into the script's text.
      #
      # The matrix below is built from SHARDS here and the manifest records the
      # same number, so the two cannot be edited apart: a shard refuses a count
      # that is not its plan's, and the aggregate requires a receipt from every
      # shard the plan has.
      - id: plan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          node scripts/check-mutants.mjs --plan mutants-plan/plan.json --shards "$SHARDS" --isolate "$ISOLATE" --base "origin/$BASE_REF" --require-base
          echo "count=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "shards=[$(seq -s, 1 "$SHARDS")]" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: mutants-plan
          path: mutants-plan/plan.json
          if-no-files-found: error

  mutants-shard:
    name: mutants (shard ${{ matrix.shard }})
    needs: mutants-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 225
    strategy:
      # A survivor in one shard must not cancel the others: the aggregate names
      # every failure at once only if every shard ran to its end.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.mutants-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A shard re-derives the plan, merge base included; see above.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: mutants-plan
          path: mutants-plan
      # Bounded as a STEP, below the job: a step that times out fails, and the
      # upload after it still runs inside a job that has not.
      - name: Sweep this shard
        timeout-minutes: 210
        env:
          SHARD: ${{ matrix.shard }}/${{ needs.mutants-plan.outputs.count }}
        run: node scripts/check-mutants.mjs --shard "$SHARD" --manifest mutants-plan/plan.json --results mutants-results
      # Whatever the sweep did. A shard that stopped part-way still has a result
      # for every file it finished, and no receipt — which is how the aggregate
      # knows. `error`, because an upload of nothing is a shard that wrote
      # nothing, and even an empty shard writes its receipt.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants-results/
          if-no-files-found: error

  mutants:
    name: mutants (changed files only)
    needs: [mutants-plan, mutants-shard]
    # `always()`: a shard that failed, or never ran, is exactly what this job
    # exists to name, so it must not be skipped with it. The event test keeps it
    # off pushes, where the plan never ran.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: mutants-plan
          path: mutants-plan
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-shard-*
          path: mutants-results
      - run: node scripts/check-mutants.mjs --aggregate --manifest mutants-plan/plan.json --results mutants-results

  windows:
    name: windows (check only)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # pnpm runs package scripts through cmd.exe on Windows, and the scripts
      # are written for a POSIX shell (`typecheck` begins `rm -rf .types`).
      # Git for Windows is on every runner; this points pnpm's script shell at
      # it, so the same scripts run rather than a second, Windows-only set.
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
    steps:
      # Every source-reading gate — the CSP test, the footprint allowlist, the
      # ledger — compares bytes. A checkout that rewrote line endings would
      # fail them for a reason that has nothing to do with the code.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # The JS half of the gate, through `build:cli`; the Cargo half is the
      # check below. `--until` exists for this line (scripts/verify.mjs).
      - run: pnpm verify --until build:cli
      - run: cargo check --manifest-path src-tauri/Cargo.toml --workspace --all-targets
