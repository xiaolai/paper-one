<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` so the reader can reach the edges on a notched
         phone; the safe-area insets are then read in CSS. `user-scalable=no`
         is deliberately NOT set: pinch-zoom is an accessibility affordance and
         a reading app is the last place to take it away. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFBFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17191B" media="(prefers-color-scheme: dark)" />
    <!-- Added to the Home Screen, this is what keeps the browser chrome away
         and the reading surface whole. It is also what buys the storage a
         non-installed site does not get on iOS. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Paper" />

    <!-- NO INLINE SCRIPT HERE, and that is the point rather than an omission.
         The Tauri entry (`index.html`) carries a paint hint that reads
         localStorage before the bundle loads. That script would need
         `script-src 'unsafe-inline'`, and `unsafe-inline` is exactly what the
         web host's Content Security Policy refuses — because foliate renders a
         book's HTML in an iframe sharing this origin, so the policy is the
         boundary between a shared book and everything else
         (`rendererIsolation.test.ts`).

         The cost is one frame of default background before the bundle paints.
         The alternative was a nonce plumbed from the server into the HTML for
         a cosmetic flash, which is a lot of machinery pointed at the wrong
         problem. -->
    <title>Paper</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.web.tsx"></script>
  </body>
</html>
